<!doctype html>

    <style>
      body {

        padding: 2px;
      }

      input,

      }

      button {

        height: 30px;
        border-radius: 8px;
        font-weight: 600;
      }

      h3 {
        background-color: #0077cc;
        color: white;
        margin: 5px 0px 5px 0px;
        padding: 4px;
        border-radius: 0px 0px 8px 8px;
      }

      .tab {
        margin-top: 10px;
      }

      .tablinks {
        background: #fff;
        border: 1px solid #ccc;
        padding: 2px 2px;
        cursor: pointer;
        margin: 0 1px;
        border-radius: 8px 8px 0 0;
        transition: background-color 0.3s ease;
        display: inline;
        align-items: center;
        gap: 8px;
        width: 100px;
      }

      .menu {
        border: 1px black solid;
        display: flex;
        overflow-x: auto;
        background: #ffffff;
        color: #000000;
        margin-top: 2px;
      }

      .menu div {
        border-radius: 2px;
        padding: 5px 8px;
        cursor: pointer;
        white-space: nowrap;
      }

      .conteudo1 {
        display: none;
      }

      .conteudo {
        display: none;
      }

      .active {
        background-color: #0077cc;
        color: white;
        border-color: #0077cc;
      }

      .activo {
        display: block;
      }

      #qtd_palete td {
        width: 80px;
      }

      .btn_inc,

        width: 50px;
        height: 40px;
        border: 1px solid #000000;
        border-radius: 4px;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 2px;
      }

      .btn_inc {
        background-color: #025707;
        color: #ffffff;
      }

      .btn_dec {

        color: #ffffff;
      }

      .total {

        color: red;
      }

      input {

      }

      .resultado {

        height: 500px;
      }

      .tabcontent {
        height: 620px;
      }

      table {
        margin-top: 2px;
        border-collapse: collapse;
      }

      #qtd_palete tr:nth-child(even) {

      }

      .colsum {
        width: 5%;
      }

      th,

        border: 1px solid #000000;
        padding: 1px;
        text-align: center;
      }

      /* Estilo do modal */
      #meuModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
      }

      .conteudoModal {
        background: white;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
      }

      input[type="time"] {

        padding: 5px;
        width: 80px;
        border-radius: 8px;
      }

      footer {
        background-color: #0077cc;
        color: white;
        text-align: center;
        padding: 5px;
        font-size: 14px;
      }

      .spinner {
        border: 3px solid #014775;
        border-top: 3px solid #00ffff;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 0.7s linear infinite;
        display: none;
        margin: 20px auto;
        position: fixed;
        /* ou absolute, dependendo do contexto */
        top: 55px;
        right: 30px;
        z-index: 9999;
        /* garante que fique acima de outros elementos */
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      .span_facil {
        border-bottom: #025707 3px solid;
        border-right: #025707 3px solid;
        border-radius: 6px;
        padding: 0px 2px 0px 2px;
        font-weight: bold;

      .span_media {

        border-right: #ff7403 3px solid;
        border-radius: 6px;
        padding: 0px 2px 0px 2px;
        font-weight: bold;

      .span_dificil {

        border-right: #880000 3px solid;
        border-radius: 6px;
        padding: 0px 2px 0px 2px;
        font-weight: bold;
      }

      .span_total {
        border: #000000 1px solid;
        border-radius: 4px;
        display: block;
      }

      .div_par {
        background-color: #e6f0ff;
        border-radius: 8px;

        justify-content: center;

      h2 {

        margin: 5px 0px 5px 0px;
        padding: 10px;
        border-radius: 8px;

      function showLoader() {
        document.getElementById("loader").style.display = "block";
      }

      function hideLoader() {

          "v2upd",

            dpk.data,
            dpk.npal,
            dpk.tempo,
            dpk.np,
            dpk.enviar,
            dpk.hfim,
          ]),
        );
      }

          );
        }

            "v2env",
            "env",
            JSON.stringify([
              dpk.id,
              dpk.data,
              dpk.npal,
              dpk.tempo,
              dpk.np,
              dpk.enviar,
              dpk.hfim,
            ]),

        }

      function info_dpk() {
        const select = document.getElementById("dia");
        select.innerHTML = "";
        const option1 = document.createElement("option");
        option1.value = "";
        option1.textContent = "-- Escolher --";
        select.appendChild(option1);
        resultados.forEach((n, i) => {
          const option = document.createElement("option");
          option.value = i;
          option.textContent = n.data;
          if (dpk.id === n.id) {
            option.selected = true;
            document.getElementById("dataHoje").innerHTML = dpk.data;
          }
          select.appendChild(option);
        });
      }

      function inc_palete(merc, cat, dif, sinal) {
        console.log(dpk.pal);
        let i = dpk.pal.reduce((acc, valor, index) => {
          if (valor.id == merc && valor.id_c == cat) {
            acc.push(index);
          }
          return acc;
        }, []);
        //  findIndex(v => v.id == merc && v.id_c == cat)
        console.log(i + " <> " + merc + " <> " + cat);
        //    alert(dpk.pal[i].cat[dif])
        if (i.length < 1) {
          let d = ["0", "0", "0"];
          sinal === "+" ? (d[dif] = 1) : (d[dif] = "0");
          dpk.pal.push({ id: merc, cat: d });
          i = dpk.pal.length - 1;
        } else {
          //     alert("> " + dpk.pal[i].cat)
          if (sinal === "-" && dpk.pal[i].cat[dif] > 0) {
            dpk.pal[i].cat[dif] = Number(dpk.pal[i].cat[dif]) - 1;
          } else if (sinal === "+") {
            dpk.pal[i].cat[dif] = Number(dpk.pal[i].cat[dif]) + 1;
          }
        }
        // alert(dpk.pal[i].cat[0]+ " <> " + dpk.pal[i].cat[1] + " <> " + dpk.pal[i].cat[2])
        document.getElementById(
          "tpal_" + merc + "_" + cat + "_" + dif,
        ).innerHTML = dpk.pal[i].cat[dif];
        document.getElementById("somapal_" + merc + "_" + cat).innerHTML =
          Number(dpk.pal[i].cat[2]) +
          Number(dpk.pal[i].cat[1]) +
          Number(dpk.pal[i].cat[0]);
        enviar_dados("v2upd", "pal", JSON.stringify(dpk.pal));
        calculo_total_paletes();
      }

      function calculo_total_paletes() {
        let total = 0;
        dpk.pal.forEach((x) => {
          total =
            total + Number(x.cat[0]) + Number(x.cat[1]) + Number(x.cat[2]);
          console.log(x);
        });
        dpk.npal = total;
        document.getElementById("pt_" + dpk.id).innerHTML = dpk.npal;
        enviar_dados(
          "v2upd",
          "dpk",
          JSON.stringify([
            dpk.id,
            dpk.data,
            dpk.npal,
            dpk.tempo,
            dpk.np,
            dpk.enviar,
            dpk.hfim,
          ]),
        );
      }

            <td style="border-bottom: #000000 1px solid">
              <button class="btn_inc" id="btn_i" onclick="inc_palete(${r[1]},${r[0]},1,'+')">+</button></td>
            <td style="border-left: #000000 1px solid;border-bottom: #000000 1px solid;">
              <button class="btn_dec" id="btn_i" onclick="inc_palete(${r[1]},${r[0]},2,'-')">-</button></td>
            <td style="border-bottom: #000000 1px solid;border-right: #000000 1px solid;">

            );
            dpk.id =

        h_fim.value = 0;
      });

      function converterParaMinutos(hora) {
        if (hora == 0) {
          return 0;
        } else {
          const [h, m] = hora.split(":").map(Number);
          return h * 60 + m;
        }
      }

      function ifIsZero(op) {
        //   alert(op==0?"--:--":op)
        if (op.length > 5) {
          op = op.substring(0, op.length - 3);
        }
        return op == 0 ? "--:--" : op;
      }

      function dataHojeFormatada() {
        const hoje = new Date();
        const dia = String(hoje.getDate()).padStart(2, "0");
        const mes = String(hoje.getMonth() + 1).padStart(2, "0"); // Janeiro é 0
        const ano = hoje.getFullYear();
        return `${dia}-${mes}-${ano}`;
      }
